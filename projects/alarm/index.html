 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passcode Alarm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #ffffff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Main display area - shows background */
        .display-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .current-time {
            font-size: 90px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #333;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.95);
        }

        /* Control panel at bottom */
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
        }

        .alarm-time {
            font-size: 18px;
            color: #555;
            text-align: center;
            margin-bottom: 15px;
        }

        .time-setter {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
        }

        .time-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .time-control label {
            font-size: 14px;
            color: #666;
        }

        .time-control .buttons {
            display: flex;
            gap: 8px;
        }

        .time-btn {
            width: 45px;
            height: 45px;
            font-size: 22px;
            font-weight: bold;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #f5f5f5;
            color: #333;
            cursor: pointer;
        }

        .time-btn:active {
            background: #eee;
        }

        .activate-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #f0f0f0;
            color: #333;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .activate-btn.active {
            background: #e0e0e0;
        }

        .activate-btn:active {
            background: #e5e5e5;
        }

        /* Settings buttons row */
        .settings-row {
            display: flex;
            gap: 10px;
        }

        .settings-btn {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
            color: #555;
            cursor: pointer;
        }

        .settings-btn:active {
            background: #f0f0f0;
        }

        #fileInput, #bgFileInput {
            display: none;
        }

        /* Unlock Screen */
        .unlock-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff0000;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: flash 0.5s infinite alternate;
        }

        .unlock-screen.show {
            display: flex;
        }

        @keyframes flash {
            from { background: #ff0000; }
            to { background: #cc0000; }
        }

        .unlock-screen h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: white;
        }

        .unlock-time {
            font-size: 56px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
            color: white;
        }

        .unlock-instruction {
            font-size: 18px;
            margin-bottom: 10px;
            color: white;
        }

        .code-display {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 10px;
            margin-bottom: 10px;
            min-height: 60px;
            color: white;
        }

        .error-message {
            color: yellow;
            font-weight: bold;
            font-size: 18px;
            min-height: 25px;
            margin-bottom: 15px;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 12px;
        }

        .numpad-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
        }

        .numpad-btn:active {
            background: rgba(255, 255, 255, 1);
        }

        .numpad-btn.clear {
            background: rgba(255, 255, 255, 0.85);
            color: #555;
        }

        .numpad-btn.submit {
            background: rgba(255, 255, 255, 0.85);
            color: #333;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 500;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.98);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 12px;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }

        .modal-input:focus {
            outline: none;
            border-color: #ccc;
        }

        .modal-label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: #666;
            font-size: 13px;
        }

        .modal-error {
            color: #e57373;
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 20px;
        }

        .modal-btn {
            padding: 12px 25px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            background: #f5f5f5;
            color: #333;
        }

        .modal-btn:active {
            background: #eee;
        }

        /* Settings Modal */
        .settings-modal-content {
            background: rgba(255, 255, 255, 0.98);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .settings-modal-content h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }

        .current-item {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            word-break: break-all;
        }

        .modal-action-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            background: #fafafa;
            color: #333;
        }

        .modal-action-btn:active {
            background: #f0f0f0;
        }

        .modal-action-btn.danger {
            color: #999;
        }

        .modal-close-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
            background: #f0f0f0;
            color: #333;
        }

        .modal-close-btn:active {
            background: #e5e5e5;
        }
    </style>
</head>
<body>
    <!-- Main Display Area - Just the time -->
    <div class="display-area">
        <div class="current-time" id="currentTime">--:--</div>
    </div>

    <!-- Control Panel at Bottom -->
    <div class="control-panel">
        <div class="alarm-time" id="alarmDisplay">⏰ Alarm: 07:30</div>
        
        <div class="time-setter">
            <div class="time-control">
                <label>Hour</label>
                <div class="buttons">
                    <button class="time-btn" onclick="adjustTime('hour', -1)">−</button>
                    <button class="time-btn" onclick="adjustTime('hour', 1)">+</button>
                </div>
            </div>
            <div class="time-control">
                <label>Minute</label>
                <div class="buttons">
                    <button class="time-btn" onclick="adjustTime('minute', -1)">−</button>
                    <button class="time-btn" onclick="adjustTime('minute', 1)">+</button>
                </div>
            </div>
        </div>
        
        <button class="activate-btn" id="activateBtn" onclick="toggleAlarm()">
            Activate Alarm
        </button>

        <div class="settings-row">
            <button class="settings-btn" onclick="showSoundModal()">🎵 Sound</button>
            <button class="settings-btn" onclick="showBgModal()">🖼️ Background</button>
            <button class="settings-btn" onclick="showPasscodeModal()">🔐 Passcode</button>
        </div>

        <input type="file" id="fileInput" accept="audio/*" onchange="handleFileUpload(event)">
        <input type="file" id="bgFileInput" accept="image/*" onchange="handleBgUpload(event)">
    </div>

    <!-- Unlock Screen -->
    <div class="unlock-screen" id="unlockScreen">
        <h1>⏰ WAKE UP! ⏰</h1>
        <div class="unlock-time" id="unlockTime">--:--</div>
        <div class="unlock-instruction">Enter passcode to stop alarm:</div>
        <div class="code-display" id="codeDisplay"></div>
        <div class="error-message" id="errorMessage"></div>
        
        <div class="numpad">
            <button class="numpad-btn" onclick="pressKey('1')">1</button>
            <button class="numpad-btn" onclick="pressKey('2')">2</button>
            <button class="numpad-btn" onclick="pressKey('3')">3</button>
            <button class="numpad-btn" onclick="pressKey('4')">4</button>
            <button class="numpad-btn" onclick="pressKey('5')">5</button>
            <button class="numpad-btn" onclick="pressKey('6')">6</button>
            <button class="numpad-btn" onclick="pressKey('7')">7</button>
            <button class="numpad-btn" onclick="pressKey('8')">8</button>
            <button class="numpad-btn" onclick="pressKey('9')">9</button>
            <button class="numpad-btn clear" onclick="pressKey('C')">C</button>
            <button class="numpad-btn" onclick="pressKey('0')">0</button>
            <button class="numpad-btn submit" onclick="pressKey('✓')">✓</button>
        </div>
    </div>

    <!-- Passcode Modal -->
    <div class="modal" id="passcodeModal">
        <div class="modal-content">
            <h2>🔐 Change Passcode</h2>
            
            <label class="modal-label">Current Passcode</label>
            <input type="tel" class="modal-input" id="oldPasscodeInput" 
                   placeholder="••••" maxlength="8">
            
            <label class="modal-label">New Passcode</label>
            <input type="tel" class="modal-input" id="newPasscodeInput" 
                   placeholder="••••" maxlength="8">
            
            <label class="modal-label">Confirm New Passcode</label>
            <input type="tel" class="modal-input" id="confirmPasscodeInput" 
                   placeholder="••••" maxlength="8">
            
            <div class="modal-error" id="modalError"></div>
            
            <div>
                <button class="modal-btn" onclick="hidePasscodeModal()">Cancel</button>
                <button class="modal-btn" onclick="savePasscode()">Save</button>
            </div>
        </div>
    </div>

    <!-- Sound Modal -->
    <div class="modal" id="soundModal">
        <div class="settings-modal-content">
            <h2>🎵 Alarm Sound</h2>
            
            <div class="current-item" id="currentSoundDisplay">Default beep</div>
            
            <button class="modal-action-btn" onclick="document.getElementById('fileInput').click(); hideSoundModal();">
                📁 Upload MP3
            </button>
            <button class="modal-action-btn" onclick="testSound()">
                🔊 Test Sound
            </button>
            <button class="modal-action-btn danger" onclick="removeSound()">
                ✕ Remove Sound
            </button>
            
            <button class="modal-close-btn" onclick="hideSoundModal()">Close</button>
        </div>
    </div>

    <!-- Background Modal -->
    <div class="modal" id="bgModal">
        <div class="settings-modal-content">
            <h2>🖼️ Background Image</h2>
            
            <div class="current-item" id="currentBgDisplay">Default (white)</div>
            
            <button class="modal-action-btn" onclick="document.getElementById('bgFileInput').click(); hideBgModal();">
                📷 Upload Image
            </button>
            <button class="modal-action-btn danger" onclick="removeBackground()">
                ✕ Remove Background
            </button>
            
            <button class="modal-close-btn" onclick="hideBgModal()">Close</button>
        </div>
    </div>

    <script>
        // Alarm state
        let alarmHour = 7;
        let alarmMinute = 30;
        let alarmActive = false;
        let alarmPlaying = false;
        let passcode = localStorage.getItem('alarmPasscode') || '1234';
        let enteredCode = '';
        
        // Audio
        let audioContext = null;
        let alarmInterval = null;
        let alarmAudio = null;
        let customSoundData = localStorage.getItem('customAlarmSound') || null;
        let customSoundName = localStorage.getItem('customAlarmSoundName') || null;
        let testAudio = null;

        // Background
        let customBgData = localStorage.getItem('customBackground') || null;
        let customBgName = localStorage.getItem('customBackgroundName') || null;

        // Initialize
        function init() {
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(checkAlarm, 1000);
            
            // Load saved settings
            const savedHour = localStorage.getItem('alarmHour');
            const savedMinute = localStorage.getItem('alarmMinute');
            if (savedHour) alarmHour = parseInt(savedHour);
            if (savedMinute) alarmMinute = parseInt(savedMinute);
            updateAlarmDisplay();
            
            // Update sound name display
            if (customSoundName) {
                document.getElementById('currentSoundDisplay').textContent = '🎵 ' + customSoundName;
            }

            // Load saved background
            if (customBgData) {
                document.body.style.backgroundImage = `url(${customBgData})`;
                document.getElementById('currentBgDisplay').textContent = '🖼️ ' + customBgName;
            }
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().slice(0, 5);
            document.getElementById('currentTime').textContent = timeStr;
            
            if (alarmPlaying) {
                document.getElementById('unlockTime').textContent = timeStr;
            }
        }

        function adjustTime(unit, delta) {
            if (unit === 'hour') {
                alarmHour = (alarmHour + delta + 24) % 24;
                localStorage.setItem('alarmHour', alarmHour);
            } else {
                alarmMinute = (alarmMinute + delta + 60) % 60;
                localStorage.setItem('alarmMinute', alarmMinute);
            }
            updateAlarmDisplay();
        }

        function updateAlarmDisplay() {
            const h = String(alarmHour).padStart(2, '0');
            const m = String(alarmMinute).padStart(2, '0');
            document.getElementById('alarmDisplay').textContent = `⏰ Alarm: ${h}:${m}`;
        }

        function toggleAlarm() {
            alarmActive = !alarmActive;
            const btn = document.getElementById('activateBtn');
            
            if (alarmActive) {
                btn.textContent = '✓ Alarm Set';
                btn.classList.add('active');
            } else {
                btn.textContent = 'Activate Alarm';
                btn.classList.remove('active');
            }
        }

        function checkAlarm() {
            if (!alarmActive || alarmPlaying) return;
            
            const now = new Date();
            if (now.getHours() === alarmHour && 
                now.getMinutes() === alarmMinute && 
                now.getSeconds() < 2) {
                triggerAlarm();
            }
        }

        function triggerAlarm() {
            alarmPlaying = true;
            alarmActive = false;
            
            document.getElementById('activateBtn').textContent = 'Activate Alarm';
            document.getElementById('activateBtn').classList.remove('active');
            
            document.getElementById('unlockScreen').classList.add('show');
            
            playAlarmSound();
        }

        // Sound Modal
        function showSoundModal() {
            document.getElementById('soundModal').classList.add('show');
        }

        function hideSoundModal() {
            document.getElementById('soundModal').classList.remove('show');
        }

        // Background Modal
        function showBgModal() {
            document.getElementById('bgModal').classList.add('show');
        }

        function hideBgModal() {
            document.getElementById('bgModal').classList.remove('show');
        }

        // Handle sound file upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            
            if (!file) return;
            
            if (!file.type.startsWith('audio/')) {
                alert('Please upload an audio file (MP3, WAV, etc.)');
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                alert('File is too large! Please use a file under 5MB.');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                customSoundData = e.target.result;
                customSoundName = file.name;
                
                try {
                    localStorage.setItem('customAlarmSound', customSoundData);
                    localStorage.setItem('customAlarmSoundName', customSoundName);
                    
                    document.getElementById('currentSoundDisplay').textContent = '🎵 ' + customSoundName;
                } catch (e) {
                    alert('Could not save sound. File might be too large. Try a smaller file.');
                    customSoundData = null;
                    customSoundName = null;
                }
            };
            
            reader.onerror = function() {
                alert('Error reading file. Please try again.');
            };
            
            reader.readAsDataURL(file);
        }

        // Remove sound
        function removeSound() {
            customSoundData = null;
            customSoundName = null;
            localStorage.removeItem('customAlarmSound');
            localStorage.removeItem('customAlarmSoundName');
            document.getElementById('currentSoundDisplay').textContent = 'Default beep';
            hideSoundModal();
        }

        // Handle background image upload
        function handleBgUpload(event) {
            const file = event.target.files[0];
            
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file (JPG, PNG, etc.)');
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                alert('File is too large! Please use a file under 5MB.');
                return;
            }
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                customBgData = e.target.result;
                customBgName = file.name;
                
                try {
                    localStorage.setItem('customBackground', customBgData);
                    localStorage.setItem('customBackgroundName', customBgName);
                    
                    document.body.style.backgroundImage = `url(${customBgData})`;
                    document.getElementById('currentBgDisplay').textContent = '🖼️ ' + customBgName;
                } catch (e) {
                    alert('Could not save background. File might be too large. Try a smaller file.');
                    customBgData = null;
                    customBgName = null;
                }
            };
            
            reader.onerror = function() {
                alert('Error reading file. Please try again.');
            };
            
            reader.readAsDataURL(file);
        }

        // Remove background
        function removeBackground() {
            customBgData = null;
            customBgName = null;
            localStorage.removeItem('customBackground');
            localStorage.removeItem('customBackgroundName');
            document.body.style.backgroundImage = 'none';
            document.getElementById('currentBgDisplay').textContent = 'Default (white)';
            hideBgModal();
        }

        // Test the sound
        function testSound() {
            if (testAudio) {
                testAudio.pause();
                testAudio = null;
            }
            
            if (customSoundData) {
                testAudio = new Audio(customSoundData);
                testAudio.volume = 1.0;
                testAudio.play().then(() => {
                    setTimeout(() => {
                        if (testAudio) {
                            testAudio.pause();
                            testAudio = null;
                        }
                    }, 3000);
                }).catch(e => {
                    console.error(e);
                });
            } else {
                playBeep();
            }
        }

        // Play alarm sound
        function playAlarmSound() {
            if (customSoundData) {
                alarmAudio = new Audio(customSoundData);
                alarmAudio.loop = true;
                alarmAudio.volume = 1.0;
                alarmAudio.play().catch(e => {
                    console.log('Custom audio failed, using beep fallback');
                    playBeepLoop();
                });
            } else {
                playBeepLoop();
            }
            
            if (navigator.vibrate) {
                vibrateLoop();
            }
        }

        function playBeep() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 880;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function playBeepLoop() {
            playBeep();
            alarmInterval = setInterval(() => {
                if (alarmPlaying) {
                    playBeep();
                    setTimeout(() => {
                        if (alarmPlaying) playBeep();
                    }, 200);
                } else {
                    clearInterval(alarmInterval);
                }
            }, 1000);
        }

        function vibrateLoop() {
            if (alarmPlaying && navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200]);
                setTimeout(vibrateLoop, 1500);
            }
        }

        function stopAlarm() {
            alarmPlaying = false;
            clearInterval(alarmInterval);
            
            if (alarmAudio) {
                alarmAudio.pause();
                alarmAudio.currentTime = 0;
                alarmAudio = null;
            }
            
            document.getElementById('unlockScreen').classList.remove('show');
            
            enteredCode = '';
            document.getElementById('codeDisplay').textContent = '';
            document.getElementById('errorMessage').textContent = '';
            
            if (navigator.vibrate) {
                navigator.vibrate(0);
            }
        }

        function pressKey(key) {
            if (key === 'C') {
                enteredCode = '';
                document.getElementById('codeDisplay').textContent = '';
                document.getElementById('errorMessage').textContent = '';
            } else if (key === '✓') {
                checkPasscode();
            } else {
                if (enteredCode.length < 8) {
                    enteredCode += key;
                    document.getElementById('codeDisplay').textContent = enteredCode;
                }
            }
        }

        function checkPasscode() {
            if (enteredCode === passcode) {
                stopAlarm();
            } else {
                document.getElementById('errorMessage').textContent = '❌ WRONG! Try again!';
                enteredCode = '';
                document.getElementById('codeDisplay').textContent = '';
                
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.frequency.value = 200;
                osc.type = 'square';
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
            }
        }

        function showPasscodeModal() {
            document.getElementById('passcodeModal').classList.add('show');
            document.getElementById('oldPasscodeInput').value = '';
            document.getElementById('newPasscodeInput').value = '';
            document.getElementById('confirmPasscodeInput').value = '';
            document.getElementById('modalError').textContent = '';
            document.getElementById('oldPasscodeInput').focus();
        }

        function hidePasscodeModal() {
            document.getElementById('passcodeModal').classList.remove('show');
        }

        function savePasscode() {
            const oldCode = document.getElementById('oldPasscodeInput').value;
            const newCode = document.getElementById('newPasscodeInput').value;
            const confirmCode = document.getElementById('confirmPasscodeInput').value;
            const errorElement = document.getElementById('modalError');
            
            if (oldCode !== passcode) {
                errorElement.textContent = '❌ Current passcode is incorrect';
                document.getElementById('oldPasscodeInput').value = '';
                document.getElementById('oldPasscodeInput').focus();
                return;
            }
            
            if (newCode.length < 4) {
                errorElement.textContent = '❌ New passcode must be at least 4 digits';
                document.getElementById('newPasscodeInput').focus();
                return;
            }
            
            if (newCode !== confirmCode) {
                errorElement.textContent = '❌ New passcodes do not match';
                document.getElementById('confirmPasscodeInput').value = '';
                document.getElementById('confirmPasscodeInput').focus();
                return;
            }
            
            if (newCode === oldCode) {
                errorElement.textContent = '❌ New passcode must be different';
                document.getElementById('newPasscodeInput').value = '';
                document.getElementById('confirmPasscodeInput').value = '';
                document.getElementById('newPasscodeInput').focus();
                return;
            }
            
            passcode = newCode;
            localStorage.setItem('alarmPasscode', passcode);
            hidePasscodeModal();
        }

        window.onbeforeunload = function() {
            if (alarmPlaying) {
                return "Alarm is still ringing! Are you sure you want to leave?";
            }
        };

        init();
    </script>
</body>
</html>
