<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passcode Alarm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .current-time {
            font-size: 72px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .alarm-time {
            font-size: 20px;
            color: #888;
            margin-bottom: 30px;
        }

        .time-setter {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .time-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .time-control label {
            font-size: 16px;
            color: #aaa;
        }

        .time-control .buttons {
            display: flex;
            gap: 10px;
        }

        .time-btn {
            width: 50px;
            height: 50px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #333355;
            color: white;
            cursor: pointer;
        }

        .time-btn:active {
            background: #444466;
        }

        .activate-btn {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .activate-btn.active {
            background: #2E7D32;
        }

        .activate-btn:active {
            opacity: 0.8;
        }

        .settings-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #444466;
            color: white;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .status {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }

        /* Unlock Screen */
        .unlock-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff0000;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: flash 0.5s infinite alternate;
        }

        .unlock-screen.show {
            display: flex;
        }

        @keyframes flash {
            from { background: #ff0000; }
            to { background: #cc0000; }
        }

        .unlock-screen h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .unlock-time {
            font-size: 56px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
        }

        .unlock-instruction {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .code-display {
            font-size: 48px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 10px;
            margin-bottom: 10px;
            min-height: 60px;
        }

        .error-message {
            color: yellow;
            font-weight: bold;
            font-size: 18px;
            min-height: 25px;
            margin-bottom: 15px;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 12px;
        }

        .numpad-btn {
            width: 70px;
            height: 70px;
            font-size: 28px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            cursor: pointer;
        }

        .numpad-btn:active {
            opacity: 0.8;
        }

        .numpad-btn.clear {
            background: #ff6600;
            color: white;
        }

        .numpad-btn.submit {
            background: #00aa00;
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 500;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #2a2a4e;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: none;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            letter-spacing: 5px;
        }

        .modal-btn {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        .modal-btn.save {
            background: #4CAF50;
            color: white;
        }

        .modal-btn.cancel {
            background: #666;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Main Screen -->
    <div class="container" id="mainScreen">
        <h1>⏰ Passcode Alarm</h1>
        
        <div class="current-time" id="currentTime">--:--</div>
        
        <div class="alarm-time" id="alarmDisplay">Alarm: 07:30</div>
        
        <div class="time-setter">
            <div class="time-control">
                <label>Hour</label>
                <div class="buttons">
                    <button class="time-btn" onclick="adjustTime('hour', -1)">−</button>
                    <button class="time-btn" onclick="adjustTime('hour', 1)">+</button>
                </div>
            </div>
            <div class="time-control">
                <label>Minute</label>
                <div class="buttons">
                    <button class="time-btn" onclick="adjustTime('minute', -1)">−</button>
                    <button class="time-btn" onclick="adjustTime('minute', 1)">+</button>
                </div>
            </div>
        </div>
        
        <button class="activate-btn" id="activateBtn" onclick="toggleAlarm()">
            Activate Alarm
        </button>
        
        <button class="settings-btn" onclick="showPasscodeModal()">
            🔐 Change Passcode
        </button>
        
        <div class="status" id="status">Ready</div>
    </div>

    <!-- Unlock Screen -->
    <div class="unlock-screen" id="unlockScreen">
        <h1>⏰ WAKE UP! ⏰</h1>
        <div class="unlock-time" id="unlockTime">--:--</div>
        <div class="unlock-instruction">Enter passcode to stop alarm:</div>
        <div class="code-display" id="codeDisplay"></div>
        <div class="error-message" id="errorMessage"></div>
        
        <div class="numpad">
            <button class="numpad-btn" onclick="pressKey('1')">1</button>
            <button class="numpad-btn" onclick="pressKey('2')">2</button>
            <button class="numpad-btn" onclick="pressKey('3')">3</button>
            <button class="numpad-btn" onclick="pressKey('4')">4</button>
            <button class="numpad-btn" onclick="pressKey('5')">5</button>
            <button class="numpad-btn" onclick="pressKey('6')">6</button>
            <button class="numpad-btn" onclick="pressKey('7')">7</button>
            <button class="numpad-btn" onclick="pressKey('8')">8</button>
            <button class="numpad-btn" onclick="pressKey('9')">9</button>
            <button class="numpad-btn clear" onclick="pressKey('C')">C</button>
            <button class="numpad-btn" onclick="pressKey('0')">0</button>
            <button class="numpad-btn submit" onclick="pressKey('✓')">✓</button>
        </div>
    </div>

    <!-- Passcode Modal -->
    <div class="modal" id="passcodeModal">
        <div class="modal-content">
            <h2>🔐 Set Passcode</h2>
            <input type="tel" class="modal-input" id="newPasscodeInput" 
                   placeholder="1234" maxlength="8">
            <div>
                <button class="modal-btn cancel" onclick="hidePasscodeModal()">Cancel</button>
                <button class="modal-btn save" onclick="savePasscode()">Save</button>
            </div>
        </div>
    </div>

    <!-- Audio element for alarm sound -->
    <audio id="alarmSound" loop>
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2LkpWQhHRtcYCLlpqWjH9wa3J/i5abl5GEeHR4goqNjYqGgH59foOHiYmIhoN/fn5/goWGhoSDgX9/f4GDhISDgYB/f3+AgYKCgYGAf39/f4CAgIB/f39/f4CAgIB/f39/gICAgH9/f3+AgICAgIB/f3+AgICAgICAf3+AgICAf3+AgIB/f4CAf3+AgH9/gIB/f4CAf39/f39/f39/f4B/f39/f39/f3+Af39/f39/gIB/f39/f4CAgH9/gIB/gICAf4CAgICAgIB/gICAgICAgICAgICAgYGBgYGBgYGBgoKCgoKCgoKCgoKCgoKCgoKCgoKBgYGBgYGBgYCAgICAgICAgICAgICAgICAgICAgYCAgICAgICAgYGBgYGBgYGBgYGBgYGBgYGBgYGAgYGBgYCBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYKCgoKCgoGBgoKBgYKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgQ==" type="audio/wav">
    </audio>

    <script>
        // Alarm state
        let alarmHour = 7;
        let alarmMinute = 30;
        let alarmActive = false;
        let alarmPlaying = false;
        let passcode = localStorage.getItem('alarmPasscode') || '1234';
        let enteredCode = '';
        
        // Audio context for alarm sound
        let audioContext = null;
        let alarmInterval = null;

        // Initialize
        function init() {
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(checkAlarm, 1000);
            
            // Load saved alarm time
            const savedHour = localStorage.getItem('alarmHour');
            const savedMinute = localStorage.getItem('alarmMinute');
            if (savedHour) alarmHour = parseInt(savedHour);
            if (savedMinute) alarmMinute = parseInt(savedMinute);
            updateAlarmDisplay();
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().slice(0, 5);
            document.getElementById('currentTime').textContent = timeStr;
            
            if (alarmPlaying) {
                document.getElementById('unlockTime').textContent = timeStr;
            }
        }

        function adjustTime(unit, delta) {
            if (unit === 'hour') {
                alarmHour = (alarmHour + delta + 24) % 24;
                localStorage.setItem('alarmHour', alarmHour);
            } else {
                alarmMinute = (alarmMinute + delta + 60) % 60;
                localStorage.setItem('alarmMinute', alarmMinute);
            }
            updateAlarmDisplay();
        }

        function updateAlarmDisplay() {
            const h = String(alarmHour).padStart(2, '0');
            const m = String(alarmMinute).padStart(2, '0');
            document.getElementById('alarmDisplay').textContent = `Alarm: ${h}:${m}`;
        }

        function toggleAlarm() {
            alarmActive = !alarmActive;
            const btn = document.getElementById('activateBtn');
            const status = document.getElementById('status');
            
            if (alarmActive) {
                btn.textContent = '✓ Alarm Set';
                btn.classList.add('active');
                const h = String(alarmHour).padStart(2, '0');
                const m = String(alarmMinute).padStart(2, '0');
                status.textContent = `Alarm will ring at ${h}:${m}`;
            } else {
                btn.textContent = 'Activate Alarm';
                btn.classList.remove('active');
                status.textContent = 'Alarm cancelled';
            }
        }

        function checkAlarm() {
            if (!alarmActive || alarmPlaying) return;
            
            const now = new Date();
            if (now.getHours() === alarmHour && 
                now.getMinutes() === alarmMinute && 
                now.getSeconds() < 2) {
                triggerAlarm();
            }
        }

        function triggerAlarm() {
            alarmPlaying = true;
            alarmActive = false;
            
            // Reset main screen button
            document.getElementById('activateBtn').textContent = 'Activate Alarm';
            document.getElementById('activateBtn').classList.remove('active');
            document.getElementById('status').textContent = 'Alarm ringing!';
            
            // Show unlock screen
            document.getElementById('unlockScreen').classList.add('show');
            
            // Start alarm sound
            playAlarmSound();
        }

        function playAlarmSound() {
            // Create audio context if needed
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            function beep() {
                if (!alarmPlaying) return;
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 880;
                oscillator.type = 'square';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }
            
            // Play beep pattern
            beep();
            alarmInterval = setInterval(() => {
                if (alarmPlaying) {
                    beep();
                    setTimeout(beep, 200);
                } else {
                    clearInterval(alarmInterval);
                }
            }, 1000);
            
            // Also try to vibrate
            if (navigator.vibrate) {
                function vibrateLoop() {
                    if (alarmPlaying) {
                        navigator.vibrate([500, 200, 500, 200]);
                        setTimeout(vibrateLoop, 1500);
                    }
                }
                vibrateLoop();
            }
        }

        function stopAlarm() {
            alarmPlaying = false;
            clearInterval(alarmInterval);
            
            // Hide unlock screen
            document.getElementById('unlockScreen').classList.remove('show');
            
            // Reset
            enteredCode = '';
            document.getElementById('codeDisplay').textContent = '';
            document.getElementById('errorMessage').textContent = '';
            document.getElementById('status').textContent = 'Good morning! ☀️';
            
            // Stop vibration
            if (navigator.vibrate) {
                navigator.vibrate(0);
            }
        }

        function pressKey(key) {
            if (key === 'C') {
                enteredCode = '';
                document.getElementById('codeDisplay').textContent = '';
                document.getElementById('errorMessage').textContent = '';
            } else if (key === '✓') {
                checkPasscode();
            } else {
                if (enteredCode.length < 8) {
                    enteredCode += key;
                    document.getElementById('codeDisplay').textContent = enteredCode;
                }
            }
        }

        function checkPasscode() {
            if (enteredCode === passcode) {
                stopAlarm();
            } else {
                document.getElementById('errorMessage').textContent = '❌ WRONG! Try again!';
                enteredCode = '';
                document.getElementById('codeDisplay').textContent = '';
                
                // Error beep
                if (audioContext) {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.frequency.value = 200;
                    osc.type = 'square';
                    gain.gain.value = 0.3;
                    osc.start();
                    osc.stop(audioContext.currentTime + 0.3);
                }
            }
        }

        function showPasscodeModal() {
            document.getElementById('passcodeModal').classList.add('show');
            document.getElementById('newPasscodeInput').value = passcode;
            document.getElementById('newPasscodeInput').focus();
        }

        function hidePasscodeModal() {
            document.getElementById('passcodeModal').classList.remove('show');
        }

        function savePasscode() {
            const newCode = document.getElementById('newPasscodeInput').value;
            if (newCode.length >= 4) {
                passcode = newCode;
                localStorage.setItem('alarmPasscode', passcode);
                hidePasscodeModal();
                document.getElementById('status').textContent = 'Passcode updated!';
            } else {
                alert('Passcode must be at least 4 digits');
            }
        }

        // Prevent closing/refreshing when alarm is playing
        window.onbeforeunload = function() {
            if (alarmPlaying) {
                return "Alarm is still ringing! Are you sure you want to leave?";
            }
        };

        // Start the app
        init();
    </script>
</body>
</html>
